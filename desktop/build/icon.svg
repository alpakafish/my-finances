<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CEFB9"/>
      <stop offset="1" stop-color="#37C18C"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37C18C"/>
      <stop offset="1" stop-color="#1D9C6D"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D9C6D"/>
      <stop offset="1" stop-color="#0C5B41"/>
    </linearGradient>
    <radialGradient id="edgeGrad" cx="0.38" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#C9973F"/>
      <stop offset="1" stop-color="#8A5F1D"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="0.38" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#F8E0A0"/>
      <stop offset="0.65" stop-color="#E7BE5C"/>
      <stop offset="1" stop-color="#D2A13F"/>
    </radialGradient>
    <mask id="pyramidBite">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <path d="M 256 90 L 186 213 L 326 213 Z"
            fill="#000000" stroke="#000000" stroke-width="30" stroke-linejoin="round"/>
      <rect x="108" y="228" width="296" height="12" rx="39" ry="6" fill="#000000"/>
      <rect x="108" y="240" width="296" height="78" rx="39" fill="#000000"/>
      <rect x="60" y="318" width="392" height="16" rx="44" ry="8" fill="#000000"/>
      <rect x="60" y="334" width="392" height="88" rx="44" fill="#000000"/>
    </mask>
  </defs>

  <!-- золотая монетка за пирамидой, обрезана по силуэту пирамиды («укус» из 3 полукругов) -->
  <g mask="url(#pyramidBite)">
    <!-- кромка/толщина монеты -->
    <circle cx="135" cy="285" r="84" fill="url(#edgeGrad)"/>

    <!-- ребристый кант (гурт): узкие насечки по окружности -->
    <circle cx="135" cy="285" r="82" fill="none" stroke="#A97B2E"
            stroke-width="5" stroke-dasharray="3.5 4.6"/>

    <!-- поле монеты, смещено вверх -> видна кромка снизу -->
    <ellipse cx="135" cy="277" rx="78" ry="73" fill="url(#faceGrad)"/>

    <!-- тонкое внутреннее кольцо поля -->
    <ellipse cx="135" cy="277" rx="66" ry="61" fill="none"
             stroke="#B9862D" stroke-width="2" opacity="0.55"/>

    <!-- блик сверху-слева -->
    <ellipse cx="99" cy="243" rx="20" ry="8" fill="#FFFFFF" opacity="0.32"
             transform="rotate(-25 99 243)"/>
  </g>

  <!-- вершина роста (скруглённый пик) -->
  <path d="M 256 90 L 186 213 L 326 213 Z"
        fill="url(#peak)" stroke="url(#peak)" stroke-width="30" stroke-linejoin="round"/>

  <!-- средний ярус накоплений -->
  <rect x="108" y="240" width="296" height="78" rx="39" fill="url(#mid)"/>

  <!-- нижний ярус -->
  <rect x="60" y="334" width="392" height="88" rx="44" fill="url(#base)"/>
</svg>
