<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мои финансы — вход</title>
<script>
// Тот же анти-мигание приём, что в public/index.html (см. desktop/DARK_THEME.md) —
// должен идти ДО <style> ниже. Это отдельное окно (main.js showAuthWindow), но тот
// же preload.js — window.desktopApp.initialEffectiveTheme уже готов синхронно.
(function () {
  var root = document.documentElement;
  root.setAttribute('data-theme', window.desktopApp.initialEffectiveTheme);
  root.style.colorScheme = window.desktopApp.initialEffectiveTheme;
})();
</script>
<style>
  * { box-sizing: border-box; }
  :root {
    --color-bg: #f5f5f3; --color-card: #fff; --color-border: #e5e5e2; --color-border-input: #d5d5d2;
    --color-text: #1a1a18; --color-text-inverse: #fff; --color-text-muted: #999; --color-expense: #D85A30;
  }
  :root[data-theme="dark"] {
    --color-bg: #1c1c1a; --color-card: #262624; --color-border: #34342f; --color-border-input: #3a3a35;
    --color-text: #f2f2f0; --color-text-inverse: #1c1c1a; --color-text-muted: #9a9a94; --color-expense: #D85A30;
  }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: var(--color-bg); color: var(--color-text);
    -webkit-app-region: drag;
  }
  .card {
    -webkit-app-region: no-drag;
    width: 320px; background: var(--color-card); border: 1px solid var(--color-border); border-radius: 14px;
    padding: 28px 26px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.12);
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  p { font-size: 12.5px; color: var(--color-text-muted); margin: 0 0 20px; }
  .btn {
    width: 100%; font-size: 13px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--color-text);
    background: var(--color-text); color: var(--color-text-inverse); cursor: pointer; font-family: inherit; font-weight: 500; margin-bottom: 10px;
  }
  .btn:hover { opacity: 0.85; }
  .btn.secondary { background: transparent; color: inherit; border-color: var(--color-border-input); }
  input[type="password"] {
    width: 100%; border: 1px solid var(--color-border-input); border-radius: 8px; padding: 10px 12px;
    font-family: inherit; font-size: 13px; margin-bottom: 10px;
    background: var(--color-card); color: var(--color-text);
  }
  .error { color: var(--color-expense); font-size: 12px; min-height: 16px; margin-bottom: 8px; }
  .divider { font-size: 11px; color: var(--color-text-muted); margin: 4px 0 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="titleText">Мои финансы заблокированы</h1>
    <p id="subtitleText">Подтвердите личность, чтобы открыть приложение</p>
    <div id="touchIdRow" hidden>
      <button class="btn" id="touchIdBtn">Разблокировать Touch ID</button>
      <div class="divider" id="divider">или паролем</div>
    </div>
    <form id="pwForm">
      <input type="password" id="pwInput" placeholder="Пароль учётной записи" autofocus>
      <div class="error" id="pwError"></div>
      <button type="submit" class="btn secondary">Войти</button>
    </form>
    <button class="btn secondary" id="cancelBtn" hidden>Отмена</button>
  </div>
  <script src="lock.js"></script>
</body>
</html>
