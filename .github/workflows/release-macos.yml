name: Release macOS Desktop App

# Собирает My Finances.app для arm64 и x64, подписывает и нотаризует (если в
# секретах репозитория заданы Apple credentials — иначе публикует неподписанный
# билд, не проваливая пайплайн) и публикует на GitHub Releases.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch: {}

# GITHUB_TOKEN по умолчанию имеет только contents:read — electron-builder
# падал с 403 "Resource not accessible by integration" при попытке создать
# релиз. contents:write даёт токену право создавать релизы и загружать в них
# файлы (только в этом репозитории, только для этого workflow).
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend deps (shared with web version)
        run: npm ci

      - name: Backend smoke test
        run: npm test --if-present

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Desktop unit tests
        working-directory: desktop
        run: npm test --if-present

      - name: Build + sign + notarize + publish
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Секреты кладём под другими именами (SECRET_*), а не под настоящими
          # напрямую — GitHub Actions подставляет пустую строку для несуществующего
          # secret, а не убирает переменную вовсе, что путает и electron-builder,
          # и наши собственные проверки ниже. Экспортируем под настоящими именами,
          # только когда они реально не пустые.
          #
          # MAC_CSC_LINK/MAC_CSC_KEY_PASSWORD — самоподписанный (не от Apple)
          # сертификат для подписи кода, см. CLAUDE.md "Apple signing/notarization".
          # Экспортируем НЕ как CSC_LINK/CSC_KEY_PASSWORD: electron-builder ищет
          # identity через `security find-identity -p codesigning`, который
          # фильтрует по доверию системы и молча пропускает недоверенный
          # самоподписанный сертификат (CSSMERR_TP_NOT_TRUSTED) — сборка тогда
          # уходит неподписанной без единой ошибки. Вместо этого
          # desktop/scripts/notarize.js (afterSign-хук) сам подписывает bundle
          # по SELFSIGNED_CSC_LINK/SELFSIGNED_CSC_KEY_PASSWORD, обращаясь к
          # сертификату напрямую по его SHA-1 хэшу — доверие системы этому не
          # мешает.
          SECRET_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$SECRET_CSC_LINK" ]; then
            export SELFSIGNED_CSC_LINK="$SECRET_CSC_LINK"
            export SELFSIGNED_CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
          fi
          if [ -n "$SECRET_APPLE_ID" ]; then
            export APPLE_ID="$SECRET_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$SECRET_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
          fi
          npx electron-builder --mac --arm64 --x64 --publish always

      - name: Upload build artifacts (debug copy, in addition to the Release)
        uses: actions/upload-artifact@v4
        with:
          name: my-finances-macos
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
