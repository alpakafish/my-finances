name: Release macOS Desktop App

# Собирает My Finances.app для arm64 и x64, подписывает и нотаризует (если в
# секретах репозитория заданы Apple credentials — иначе публикует неподписанный
# билд, не проваливая пайплайн) и публикует на GitHub Releases.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend deps (shared with web version)
        run: npm ci

      - name: Backend smoke test
        run: npm test --if-present

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Desktop unit tests
        working-directory: desktop
        run: npm test --if-present

      - name: Build + sign + notarize + publish
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Секреты, которых нет в репозитории, GitHub Actions подставляет как
          # пустую строку, а не убирает переменную — пустой CSC_LINK electron-builder
          # ошибочно принимает за путь к сертификату (резолвит в cwd, падает "not a
          # file"). CSC_IDENTITY_AUTO_DISCOVERY=false отключает попытку авто-поиска
          # сертификата и чинит это; на реальную подпись через непустой CSC_LINK не
          # влияет — тот путь electron-builder всегда обрабатывает отдельно.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 --x64 --publish always

      - name: Upload build artifacts (debug copy, in addition to the Release)
        uses: actions/upload-artifact@v4
        with:
          name: my-finances-macos
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
